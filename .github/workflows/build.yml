name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Preia codul
        uses: actions/checkout@v4

      - name: Instalează Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pregătește Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalează Gradle 8.7
        run: |
          curl -sL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d $HOME/gradle
          echo "$HOME/gradle/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Construiește APK-ul
        run: gradle assembleDebug --no-daemon

      - name: Încarcă APK-ul (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: Electricianul-APK
          path: app/build/outputs/apk/debug/app-debug.apk
